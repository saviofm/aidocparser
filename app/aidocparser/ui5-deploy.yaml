specVersion: '2.4'
metadata:
  name: aidocparser
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - /test/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: aidocparser
        additionalFiles:
          - xs-app.json
