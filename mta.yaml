_schema-version: "3.1"
ID: aidocparser
version: 1.0.0
description: AI Document Parser — parse inteligente de documentos para grounding RAG

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --prefix srv
        - npx cds build --production
        - npm install --prefix app/aidocparser

modules:

  # ── Backend CAP ───────────────────────────────────────────────────────────
  - name: aidocparser-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm
    requires:
      - name: aidocparser-hana
      - name: aidocparser-xsuaa
      - name: default_aicore
      - name: aidocparser-object-store
      - name: aidocparser-sdm
      - name: aidocparser-dest
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ── HANA DB deployer ─────────────────────────────────────────────────────
  - name: aidocparser-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: aidocparser-hana

  # ── Destination content ───────────────────────────────────────────────────
  - name: aidocparser-dest-content
    type: com.sap.application.content
    path: .
    requires:
      - name: aidocparser-xsuaa
        parameters:
          service-key:
            name: aidocparser-xsuaa-key
      - name: aidocparser-html5repo
        parameters:
          service-key:
            name: aidocparser-html5repo-key
      - name: srv-api
      - name: aidocparser-dest
        parameters:
          content-target: true
    parameters:
      content:
        subaccount:
          destinations:
            - Name: aidocparser-html5repo
              ServiceInstanceName: aidocparser-html5-service
              ServiceKeyName: aidocparser-html5repo-key
              sap.cloud.service: aidocparser
            - Authentication: OAuth2UserTokenExchange
              Name: aidocparser-xsuaa
              ServiceInstanceName: aidocparser-xsuaa-service
              ServiceKeyName: aidocparser-xsuaa-key
              sap.cloud.service: aidocparser
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  # ── UI5 app deployer ─────────────────────────────────────────────────────
  - name: aidocparser-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: aidocparser-html5repo
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: aidocparser-webapp
          artifacts:
            - aidocparser.zip
          target-path: resources/

  - name: aidocparser-webapp
    type: html5
    path: app/aidocparser
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:

  - name: aidocparser-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: aidocparser-xsuaa-service
      path: ./xs-security.json
      config:
        xsappname: aidocparser-${org}-${space}
        tenant-mode: dedicated

  - name: aidocparser-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: aidocparser-hana

  - name: aidocparser-html5repo
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: aidocparser-html5-service

  - name: aidocparser-dest
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      service-name: aidocparser-destination-service
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: "true"
                HTML5.ForwardAuthToken: "true"
                HTML5.Timeout: "60000"
                Name: aidocparser-backend
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update

  - name: aidocparser-object-store
    type: org.cloudfoundry.managed-service
    parameters:
      service: objectstore
      service-name: aidocparser-object-store
      service-plan: s3-standard

  - name: aidocparser-sdm
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: document-management-standard-service

  - name: default_aicore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: default_aicore
